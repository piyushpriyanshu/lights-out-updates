name: diag-live
on: { push: { branches: [diag-live-fp1] } }
permissions: { contents: write }
jobs:
  record:
    if: "!contains(github.event.head_commit.message, '[results]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python -u diag/radio.py > diag/radio.txt 2>&1 || true
      - run: |
          git config user.name "Lights Out diag"; git config user.email "noreply@anthropic.com"
          git add diag/radio.txt; git commit -m "[results] radio check" && git push
