name: diag-live
on: { push: { branches: [diag-live-fp1] } }
permissions: { contents: write }
jobs:
  record:
    if: "!contains(github.event.head_commit.message, '[results]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python -u diag/fp1.py > diag/fp1.txt 2>&1 || true
      - run: |
          git config user.name "Lights Out diag"; git config user.email "noreply@anthropic.com"
          git add diag/fp1.txt diag/fp1 || git add diag/fp1.txt
          git commit -m "[results] FP1 data" && git push
