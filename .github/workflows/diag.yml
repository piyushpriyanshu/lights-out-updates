name: diag-live
on: { push: { branches: [diag-live-fp1] } }
permissions: { contents: write }
jobs:
  record:
    if: "!contains(github.event.head_commit.message, '[results]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests websocket-client
      - run: python -u diag/ref.py > diag/ref.txt 2>&1 || true
      - run: |
          git config user.name "Lights Out diag"; git config user.email "noreply@anthropic.com"
          git add diag/ref.txt; git add diag/ref9.json || true
          git commit -m "[results] reference lap" && git push
